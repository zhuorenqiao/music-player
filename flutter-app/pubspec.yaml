name: light_music
description: 流光音乐 —— Flutter 版本地音乐播放器
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  http: ^1.6.0
  file_picker: ^13.3.2
  fast_gbk: ^1.0.0
  flutter_media_session: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
