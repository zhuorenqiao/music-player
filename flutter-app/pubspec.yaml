name: light_music
description: 流光音乐 —— Flutter 版本地音乐播放器
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  path: ^1.9.0
  path_provider: ^2.1.6
  http: ^1.6.0
  file_picker: ^13.3.2
  fast_gbk: ^1.0.0
  flutter_media_session: ^3.0.9
  crypto: ^3.0.8
  permission_handler: ^12.0.0
  # M3 频谱管线（spec §15 设计表既定）：离线解 PCM + radix-2 FFT。
  audio_decoder: ^0.8.1
  fft: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # M3 T1 解码探针的真机宿主（integration_test 需要原生 app shell）。
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
